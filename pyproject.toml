[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avance-azure-devops"
version = "0.1.0"
description = "Genera correos de integración desde Pull Requests de Azure DevOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pyperclip>=1.9,<2",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.scripts]
avance = "avance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["avance"]

